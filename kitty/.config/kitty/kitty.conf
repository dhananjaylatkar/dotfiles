font_family      family='Iosevka Term' style=Light
bold_font        family='Iosevka Term' style=Regular
italic_font      family='Iosevka Term' style='Light Italic'
font_size        18.0

copy_on_select yes
mouse_map right press ungrabbed paste_from_clipboard

